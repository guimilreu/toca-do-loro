<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>starpink — call pública</title>
    <meta name="description" content="Uma única call pública. Entre com seu nome, fale e compartilhe a tela." />
    <meta name="theme-color" content="#0c0a12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-mic" viewBox="0 0 24 24">
        <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z" />
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
      </symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24">
        <path d="M9 9.2V6a3 3 0 0 1 5.9-.7M15 12.4a3 3 0 0 1-5.2 1.8" />
        <path d="M5 11a7 7 0 0 0 10.9 5.8M19 11v1M12 18v3" />
        <path d="m3 3 18 18" />
      </symbol>
      <symbol id="i-screen" viewBox="0 0 24 24">
        <rect x="2.5" y="4" width="19" height="13" rx="2.5" />
        <path d="M8.5 20.5h7M12 17v3.5" />
      </symbol>
      <symbol id="i-screen-off" viewBox="0 0 24 24">
        <path d="M21.5 15.6V6.5A2.5 2.5 0 0 0 19 4H8.4M2.9 4.9A2.5 2.5 0 0 0 2.5 6.5v8A2.5 2.5 0 0 0 5 17h12" />
        <path d="M8.5 20.5h7M12 17v3.5" />
        <path d="m3 3 18 18" />
      </symbol>
      <symbol id="i-leave" viewBox="0 0 24 24">
        <path d="M15.5 8.5V6.2c0-1-.8-1.7-1.7-1.7H5.7c-1 0-1.7.8-1.7 1.7v11.6c0 1 .8 1.7 1.7 1.7h8.1c1 0 1.7-.8 1.7-1.7v-2.3" />
        <path d="M11 12h9m0 0-3-3m3 3-3 3" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M9 4H4v5M20 9V4h-5M15 20h5v-5M4 15v5h5" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1Z" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 2.5 14.1 9h6.9l-5.6 4 2.2 6.6-5.6-4-5.6 4L8.6 13 3 9h6.9L12 2.5Z" />
      </symbol>
    </svg>

    <!-- ============ Entrada ============ -->
    <section id="view-join" class="view view-join">
      <div class="join-card">
        <div class="brand">
          <svg class="brand-star" aria-hidden="true"><use href="#i-star" /></svg>
          <span>starpink</span>
        </div>
        <p class="join-sub">Uma sala só. Voz e tela, sem cadastro.</p>

        <form id="join-form" autocomplete="off" novalidate>
          <label class="field">
            <span class="field-label">Seu nome</span>
            <input
              id="name-input"
              name="name"
              type="text"
              maxlength="24"
              placeholder="como querem te chamar?"
              required
              autofocus
            />
          </label>
          <button id="join-btn" class="btn btn-primary btn-block" type="submit">Entrar na call</button>
        </form>

        <p id="lobby-status" class="lobby-status">
          <span class="dot dot-idle"></span><span id="lobby-text">conectando…</span>
        </p>
        <p id="join-error" class="alert" hidden></p>
      </div>
      <p class="join-foot">Sem gravação, sem histórico. A mídia vai direto de pessoa para pessoa (P2P).</p>
    </section>

    <!-- ============ Call ============ -->
    <section id="view-call" class="view view-call" hidden>
      <header class="topbar">
        <div class="brand brand-sm">
          <svg class="brand-star" aria-hidden="true"><use href="#i-star" /></svg>
          <span id="room-name">starpink</span>
        </div>
        <div class="topbar-right">
          <span id="conn-pill" class="pill"><span class="dot dot-idle"></span><span id="conn-text">conectando</span></span>
          <span id="count-pill" class="pill pill-quiet">1 na call</span>
        </div>
      </header>

      <main id="stage" class="stage">
        <div id="share-area" class="share-area" hidden>
          <div id="share-tabs" class="share-tabs"></div>
          <div class="share-frame">
            <video id="share-video" autoplay playsinline></video>
            <button id="fullscreen-btn" class="icon-btn share-fs" type="button" title="Tela cheia" aria-label="Tela cheia">
              <svg aria-hidden="true"><use href="#i-expand" /></svg>
            </button>
          </div>
        </div>
        <div id="grid" class="grid" role="list"></div>
      </main>

      <footer class="controls">
        <div class="controls-inner">
          <button id="mic-btn" class="ctrl" type="button" aria-pressed="false" title="Microfone (M)">
            <svg aria-hidden="true"><use id="mic-icon" href="#i-mic" /></svg>
            <span class="ctrl-label" id="mic-label">Mudo</span>
          </button>
          <button id="share-btn" class="ctrl" type="button" aria-pressed="false" title="Compartilhar tela">
            <svg aria-hidden="true"><use id="share-icon" href="#i-screen" /></svg>
            <span class="ctrl-label" id="share-label">Compartilhar</span>
          </button>
          <div class="ctrl-wrap">
            <button id="settings-btn" class="ctrl" type="button" aria-expanded="false" title="Dispositivos">
              <svg aria-hidden="true"><use href="#i-gear" /></svg>
              <span class="ctrl-label">Áudio</span>
            </button>
            <div id="settings-panel" class="popover" hidden>
              <label class="field">
                <span class="field-label">Microfone</span>
                <select id="mic-select"></select>
              </label>
              <div class="meter"><div id="mic-meter" class="meter-fill"></div></div>
            </div>
          </div>
          <button id="leave-btn" class="ctrl ctrl-danger" type="button" title="Sair da call">
            <svg aria-hidden="true"><use href="#i-leave" /></svg>
            <span class="ctrl-label">Sair</span>
          </button>
        </div>
      </footer>
    </section>

    <div id="audio-sink" class="sr-only" aria-hidden="true"></div>
    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
